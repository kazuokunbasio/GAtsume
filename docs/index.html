<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>GAtsume（ゴキあつめ）</title>
  <style>
    :root {
      --bg: #faf8f5;
      --fg: #1f1f1f;
      --muted: #5b5b5b;
      --accent: #4a8b4a;
      --card: #ffffff;
      --border: #e6e0d6;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue",
                   "Hiragino Sans", "Yu Gothic UI", sans-serif;
      background: var(--bg);
      color: var(--fg);
      line-height: 1.7;
    }
    header {
      padding: 2.5rem 1.5rem 1.5rem;
      text-align: center;
      border-bottom: 1px solid var(--border);
    }
    header h1 {
      margin: 0;
      font-size: 1.9rem;
      letter-spacing: 0.02em;
    }
    main {
      max-width: 640px;
      margin: 0 auto;
      padding: 1.75rem 1.25rem 2.5rem;
    }
    section {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 1.25rem 1.4rem;
      margin-bottom: 1rem;
    }
    section h2 {
      margin: 0 0 0.6rem;
      font-size: 1.1rem;
    }
    section p { margin: 0.4rem 0; }
    section ul { padding-left: 1.2rem; margin: 0.4rem 0; }
    section li { margin: 0.25rem 0; }
    a {
      color: var(--accent);
      text-decoration: none;
    }
    a:hover { text-decoration: underline; }
    .contact {
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 0.95rem;
    }
    .faq-item { margin: 0.9rem 0; }
    .faq-item .q {
      font-weight: 600;
      margin: 0 0 0.2rem;
    }
    .faq-item .a {
      margin: 0;
      color: var(--fg);
    }
    footer {
      text-align: center;
      color: var(--muted);
      font-size: 0.85rem;
      padding: 1.25rem;
      border-top: 1px solid var(--border);
    }
  </style>
</head>
<body>
  <header>
    <h1>GAtsume（ゴキあつめ）</h1>
  </header>

  <main>
    <section>
      <h2>アプリ概要</h2>
      <ul>
        <li>放置型コレクションゲーム</li>
        <li>部屋にエサや家具を置いてゴキを集める</li>
        <li>ブラックユーモア系のカジュアルゲーム</li>
        <li>図鑑収集やレア種収集ができる</li>
      </ul>
    </section>

    <section>
      <h2>サポート</h2>
      <p>お問い合わせ:</p>
      <p class="contact"><a href="mailto:kinniku.kin.gin@gmail.com">kinniku.kin.gin@gmail.com</a></p>
    </section>

    <section>
      <h2>FAQ</h2>
      <div class="faq-item">
        <p class="q">Q. 広告を削除できますか？</p>
        <p class="a">A. アプリ内購入で永久に広告を削除できます。</p>
      </div>
      <div class="faq-item">
        <p class="q">Q. データは引き継げますか？</p>
        <p class="a">A. 現在は端末内保存です。</p>
      </div>
    </section>

    <section>
      <h2>Links</h2>
      <ul>
        <li><a href="privacy.html">Privacy Policy</a></li>
      </ul>
    </section>
  </main>

  <footer>
    &copy; 2026 GAtsume
  </footer>
</body>
</html>
